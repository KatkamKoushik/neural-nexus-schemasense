name: SchemaSense CI & Engineering Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-and-supply-chain:
    name: Security, Supply-Chain & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit & SBOM tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Secret scanning (detect-secrets)
        run: |
          detect-secrets scan --baseline .secrets.baseline --exclude-files "(\.git|__pycache__|\.venv|venv|\.secrets\.baseline)"

      - name: Generate CycloneDX Software Bill of Materials (SBOM)
        run: |
          cyclonedx-py requirements constraints.txt -o sbom.cyclonedx.json

      - name: Evaluate vulnerabilities via OSV-Scanner
        uses: google/osv-scanner-action@v1.9.2
        with:
          scan-args: |-
            --sbom=sbom.cyclonedx.json

      - name: Upload SBOM release artifact
        uses: actions/upload-artifact@v7
        with:
          name: schemasense-sbom
          path: sbom.cyclonedx.json
          retention-days: 14

  lint-and-unit-tests:
    name: Lint & Fast Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (reproducible with constraints)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Lint with Ruff
        run: |
          ruff check schemasense/ tests/

      - name: Compile check
        run: |
          python -m py_compile app.py

      - name: Run fast unit tests & measure coverage (isolated SQLite)
        run: |
          pytest -v --ignore=tests/test_live_integration.py --cov=schemasense --cov-report=term-missing --cov-report=xml:coverage-unit-${{ matrix.python-version }}.xml --cov-fail-under=70

      - name: Upload unit test coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: coverage-unit-${{ matrix.python-version }}.xml
          retention-days: 7

  integration-tests:
    name: Live Integration & Adversarial Verification (Postgres & MySQL)
    runs-on: ubuntu-latest
    needs: [lint-and-unit-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schemasense_test
          POSTGRES_USER: test_admin
          POSTGRES_PASSWORD: test_admin_pass
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: schemasense_test
          MYSQL_USER: test_admin
          MYSQL_PASSWORD: test_admin_pass
          MYSQL_ROOT_PASSWORD: root_test_pass
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (reproducible with constraints)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Run live integration tests & adversarial suite
        run: |
          pytest -v tests/test_live_integration.py tests/test_ui_apptest.py --cov=schemasense --cov-report=term-missing --cov-report=xml:coverage-integration.xml

      - name: Upload integration test coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage-integration.xml
          retention-days: 7
