# Docker Compose configuration for SchemaSense live integration & adversarial tests
services:
  test-postgres:
    image: postgres:16-alpine
    container_name: schemasense-test-postgres
    environment:
      POSTGRES_USER: test_admin
      POSTGRES_PASSWORD: test_admin_pass
      POSTGRES_DB: schemasense_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_admin -d schemasense_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  test-mysql:
    image: mysql:8.4
    container_name: schemasense-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_test_pass
      MYSQL_DATABASE: schemasense_test
      MYSQL_USER: test_admin
      MYSQL_PASSWORD: test_admin_pass
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_test_pass"]
      interval: 2s
      timeout: 3s
      retries: 25
